name = "neighbors-api"
main = "src/index.mjs"
compatibility_date = "2026-09-01"

# Custom domain on the johnhubert.llc zone. Remove this block to use the workers.dev URL while testing.
routes = [{ pattern = "neighbors-api.johnhubert.llc", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "neighbors"
database_id = "REPLACE_WITH_THE_ID_FROM_wrangler_d1_create"

[vars]
DATA_BASE = "https://johnhubert.llc/floor/data"
ALLOWED_ORIGINS = "https://johnhubert.llc,capacitor://localhost,http://localhost:8080"

# Secrets (set with `wrangler secret put NAME`):
#   ADMIN_KEY   a long random string for /v1/admin/* and the review page (openssl rand -hex 32)
#   GH_TOKEN    (later) a fine-grained GitHub token scoped to 1084/neighbors, contents: write, so approving a
#               contribution can commit it to data/contrib/ and whats-new.json; until it is set, approvals
#               are exported from the review page as JSON instead
