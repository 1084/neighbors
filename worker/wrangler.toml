name = "neighbors-api"
main = "src/index.mjs"
compatibility_date = "2026-09-01"

# Custom domain on the johnhubert.llc zone. Remove this block to use the workers.dev URL while testing.
routes = [{ pattern = "neighbors-api.johnhubert.llc", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "neighbors"
database_id = "fb8c8c9b-ed66-4b76-becd-8f4864f53136"

[vars]
DATA_BASE = "https://johnhubert.llc/floor/data"
ALLOWED_ORIGINS = "https://johnhubert.llc,capacitor://localhost,http://localhost:8080"

# Secrets (set with `wrangler secret put NAME`):
#   ADMIN_KEY   a long random string for /v1/admin/* and the review page (openssl rand -hex 32)
#   GH_TOKEN    a fine-grained GitHub token scoped to 1084/neighbors, contents: read and write, so approving a
#               contribution commits it to data/contrib/approved.json; without it, approvals are exported
#               from the review page as JSON instead (see README)
